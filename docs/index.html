<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obscura Studio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0c1220;color:#f8fafc}main{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.copy{padding:clamp(28px,7vw,92px);display:flex;flex-direction:column;justify-content:center}.brand{font-weight:800;color:#99f6e4;margin-bottom:24px}h1{font-size:clamp(42px,7vw,86px);line-height:.96;margin:0 0 24px}p{font-size:18px;line-height:1.7;color:#d8e2ee;max-width:720px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}a{color:#0c1220;background:#99f6e4;text-decoration:none;border-radius:8px;padding:13px 16px;font-weight:800}.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}.art{position:relative;background:linear-gradient(135deg,#102a43,#1f4e5f 48%,#f0a84d);overflow:hidden}.card{position:absolute;border-radius:8px;box-shadow:0 30px 70px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.28)}.one{left:10%;top:12%;width:44%;aspect-ratio:4/5;background:linear-gradient(145deg,#16213e,#5f9ea0 54%,#f4d35e)}.two{right:9%;top:28%;width:42%;aspect-ratio:1/1;background:linear-gradient(145deg,#f8f1e7,#2c7a7b 48%,#121826)}.three{left:25%;bottom:10%;width:52%;aspect-ratio:16/9;background:linear-gradient(145deg,#0f172a,#8ecae6,#ffb703)}@media(max-width:860px){main{grid-template-columns:1fr}.art{min-height:42vh}.copy{min-height:58vh}}
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div class="brand">Obscura Studio</div>
      <h1>私密 AI 图像生成网站</h1>
      <p>一个可部署到 VPS 的服务端应用，包含访问凭证、额度、文本生成图像、参考图、多模型 Provider、作品历史和管理员后台。GitHub Pages 只承载这个外部介绍页；完整创作服务需要运行仓库中的 Python 后端。</p>
      <div class="actions">
        <a href="https://github.com/Daniel622/Art">查看源码与部署说明</a>
        <a class="ghost" href="https://github.com/Daniel622/Art#快速启动">快速启动</a>
      </div>
    </section>
    <section class="art">
      <div class="card one"></div>
      <div class="card two"></div>
      <div class="card three"></div>
    </section>
  </main>
</body>
</html>
